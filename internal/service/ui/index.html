<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='3' width='12' height='10' rx='2' fill='%2316a34a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">silo</h1>
    <p id="summary" class="summary"></p>
    <span id="health" class="health"></span>
  </div>
</header>
<div id="notices" class="notices"></div>
<main class="layout">
  <div id="containers" class="containers" aria-live="polite"><p class="empty">Loading…</p></div>
  <aside class="side">
    <section class="panel">
      <h2>Service</h2>
      <dl id="service" class="facts-list"></dl>
    </section>
    <section class="panel">
      <h2>Base templates</h2>
      <div id="bases"></div>
    </section>
    <section class="panel">
      <h2>Activity</h2>
      <ol id="events" class="events"><li class="none">Nothing has happened since this page opened.</li></ol>
    </section>
  </aside>
</main>
<dialog id="dialog" class="logs" aria-labelledby="dialog-title">
  <header class="logs-head">
    <div class="logs-title">
      <h2 id="dialog-title"></h2>
      <p id="dialog-sub" class="logs-sub"></p>
    </div>
    <div class="btns">
      <button id="dialog-refresh" type="button">Refresh</button>
      <button id="dialog-close" type="button">Close</button>
    </div>
  </header>
  <div id="dialog-body" class="logs-body"></div>
</dialog>
<div id="toast" role="status"></div>
</body>
</html>
