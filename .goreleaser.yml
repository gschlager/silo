version: 2

builds:
  - main: ./cmd/silo
    binary: silo
    ldflags:
      - -s -w -X github.com/gschlager/silo/internal/cli.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "silo-{{.Version}}-{{.Os}}-{{.Arch}}"

changelog:
  use: github-native

release:
  github:
    owner: gschlager
    name: silo
